<div class="min-h-screen bg-[#f8fafc] font-sans text-[#1e293b] flex flex-col items-center">
    <!-- Header -->
    <header class="w-full bg-white px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#0d7ff2] rounded-lg flex items-center justify-center">
                <span class="material-icons-outlined text-white text-xl">shower</span>
            </div>
            <span class="font-bold text-xl tracking-tight text-[#0f172a]">PaguePix</span>
        </div>
        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center border border-slate-200">
            <span class="material-icons-outlined text-slate-500 text-xl">person</span>
        </div>
    </header>

    <main class="flex-1 max-w-lg w-full px-6 py-5 flex flex-col items-center">
        <!-- Title Section -->
        <section class="w-full text-center mb-5">
            <h1 class="text-3xl font-black text-[#0f172a] mb-2">Tempo de Banho</h1>
        </section>

        <!-- Options List -->
        <div class="flex flex-col gap-4 w-full mb-10">
            <div *ngFor="let option of durationOptions" (click)="selectDuration(option)" [ngClass]="{
                    'border-[#0d7ff2] ring-2 ring-[#0d7ff2]/10 bg-white selected-option': selectedDuration()?.minutes === option.minutes,
                    'border-slate-100 bg-white hover:border-[#0d7ff2]/30 shadow-sm': selectedDuration()?.minutes !== option.minutes
                 }"
                class="p-3 rounded-2xl border transition-all cursor-pointer flex items-center justify-between group">

                <div class="flex items-center gap-4">
                    <div [ngClass]="{
                        'bg-[#0d7ff2] text-white': selectedDuration()?.minutes === option.minutes,
                        'bg-[#ebf5ff] text-[#0d7ff2]': selectedDuration()?.minutes !== option.minutes
                    }"
                        class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg transition-colors overflow-hidden">
                        <ng-container [ngSwitch]="option.minutes">
                            <span *ngSwitchCase="1" class="material-icons-outlined text-2xl relative">
                                timer
                                <span
                                    class="absolute inset-0 flex items-center justify-center text-[8px] font-black pt-1">10</span>
                            </span>
                            <span *ngSwitchDefault>{{ option.minutes }}</span>
                        </ng-container>
                    </div>
                    <div class="flex flex-col">
                        <h3 class="font-bold text-[#0f172a] text-[15px]">{{ option.label }}</h3>
                        <p class="text-[11px] text-slate-400 font-medium italic">{{ option.description }}</p>
                    </div>
                </div>

                <div class="text-lg font-black text-[#0d7ff2]">
                    {{ option.price | currency:'BRL' }}
                </div>
            </div>
        </div>

        <!-- Payment Details (Always visible or shows up on select) -->
        <div
            class="w-full bg-white rounded-3xl shadow-lg shadow-slate-200/60 border border-slate-50 p-8 flex flex-col items-center mb-8">


            <button (click)="copyPixKey()"
                class="w-full bg-[#f1f5f9] hover:bg-slate-200 text-[#0f172a] font-bold py-4 px-6 rounded-2xl transition-all flex items-center justify-center gap-3 mb-6 group">
                <span class="material-icons-outlined text-xl">content_copy</span>
                <span class="text-[15px]">Copiar Chave Pix</span>
            </button>

            <p class="text-[11px] text-slate-300 font-medium text-center">
                Aguardando confirmação do pagamento...
            </p>
        </div>

        <!-- Bottom Action -->
        <div
            class="w-full bg-white p-4 rounded-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.02)] fixed bottom-0 left-0 right-0 flex justify-center md:static md:bg-transparent md:p-0 md:shadow-none">
            <button
                class="w-full max-w-lg bg-[#0d7ff2] hover:bg-[#0a6ed5] text-white font-bold py-5 px-8 rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl shadow-blue-600/20 mb-6 active:scale-[0.98]">
                <span class="text-[16px]">Confirmar e Pagar</span>
                <span class="material-icons-outlined">arrow_forward</span>
            </button>
        </div>
    </main>
</div>

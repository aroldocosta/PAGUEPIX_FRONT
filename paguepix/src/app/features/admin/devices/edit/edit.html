<app-management-layout [title]="id() ? 'Editar Dispositivo' : 'Novo Dispositivo'"
    [subtitle]="id() ? 'Altere as informações do terminal selecionado.' : 'Cadastre um novo terminal no sistema.'"
    [loading]="loading" [hasData]="hasData">

    <ng-template #tableContent>
        <div class="p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulário de Edição -->
            <app-device-form class="lg:col-span-2" [id]="id()!" [mqttId]="mqttId()" [name]="name()" [model]="model()"
                [partnerId]="partnerId()" [partners]="partners()" [mode]="formMode()" [loading]="loading()"
                (save)="onSave($event)" (releaseManual)="onReleaseManual($event)" (cancel)="onCancel()">
            </app-device-form>

            <!-- Card do QR Code -->
            <div class="space-y-6">
                <app-device-qr-card *ngIf="id()" [qrUrl]="qrUrl()" [mqttId]="mqttId()" [name]="name()" [model]="model()"
                    [id]="id()!">
                </app-device-qr-card>

                <!-- Ações do QR Code -->
                <button *ngIf="id()" (click)="printQr()"
                    class="w-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 py-4 rounded-3xl font-black text-sm flex items-center justify-center gap-2 transition-all border border-slate-200 dark:border-slate-700">
                    <span class="material-icons-outlined">print</span>
                    IMPRIMIR QR CODE
                </button>
            </div>
        </div>
    </ng-template>

</app-management-layout>

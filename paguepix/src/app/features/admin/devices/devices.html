<app-management-layout title="Gestão de Dispositivos"
    subtitle="Monitore e gerencie os dispositivos habilitados para pagamento."
    searchPlaceholder="Buscar dispositivos..." addButtonLabel="Adicionar Dispositivo" addButtonIcon="add_to_queue"
    addRoute="/admin/devices/new" [loading]="loading" [hasData]="hasData" emptyStateIcon="no_sim"
    emptyStateMessage="Nenhum dispositivo encontrado.">

    <div headerActions class="flex items-center gap-2">
        <label for="partnerFilter" class="text-xs font-bold text-slate-400 uppercase tracking-widest hidden lg:block">Filtrar:</label>
        <select id="partnerFilter" [(ngModel)]="selectedPartnerId" 
            class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all outline-none">
            <option value="all">Todos os Parceiros</option>
            <option *ngFor="let p of partners()" [value]="p.id">{{ p.name }}</option>
        </select>
    </div>

    <ng-template #tableContent>
        <app-device-list [devices]="filteredDevices()" mode="admin" [loading]="loading()" (view)="onView($event)"
            (edit)="onEdit($event)" (delete)="onDelete($event)">
        </app-device-list>
    </ng-template>
</app-management-layout>

<app-device-detail *ngIf="selectedDevice()" [device]="selectedDevice()!" (close)="onCloseDetail()">
</app-device-detail>

<app-delete-modal *ngIf="showDeleteModal()" [objectName]="deviceToDelete()?.name || ''"
    alertMessage="O dispositivo deixará de processar vendas e precisará ser reconfigurado manualmente se for reativado."
    [loading]="isDeleting()" (confirm)="confirmDelete()" (cancel)="closeDeleteModal()">
</app-delete-modal>

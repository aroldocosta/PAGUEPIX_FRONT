<app-management-layout title="Gestão de Dispositivos"
    subtitle="Monitore e gerencie terminais POS e dispositivos habilitados para Pix."
    searchPlaceholder="Buscar dispositivos..." addButtonLabel="Provisionar Dispositivo" addButtonIcon="add_to_queue"
    addRoute="/admin/devices/new" [loading]="loading" [hasData]="hasData" emptyStateIcon="no_sim"
    emptyStateMessage="Nenhum dispositivo encontrado.">

    <ng-template #tableHeader>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Dispositivo / Código
        </th>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Modelo</th>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Parceiro
        </th>
        <th
            class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-right">
            Ações</th>
    </ng-template>

    <ng-template #tableRow>
        <tr *ngFor="let device of devices()"
            class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
            <td class="px-8 py-0.5">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-50 to-blue-50 dark:from-slate-800 dark:to-slate-700 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold ring-1 ring-indigo-100 dark:ring-slate-700">
                        <span class="material-icons-outlined text-lg">devices</span>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-gray-900 dark:text-slate-200">{{
                            device.code }}</div>
                        <div class="text-[10px] text-gray-400 dark:text-slate-500 font-mono">ID: #{{
                            device.id }}</div>
                    </div>
                </div>
            </td>
            <td class="px-8 py-0.5 text-sm font-medium text-gray-600 dark:text-slate-400">
                {{ device.model }}
            </td>
            <td class="px-8 py-0.5">
                <span class="text-sm font-medium text-gray-700 dark:text-slate-300">
                    {{ device.partner?.name || 'Não vinculado' }}
                </span>
            </td>
            <td class="px-8 py-0.5 text-right">
                <div class="flex items-center justify-end gap-2">
                    <button [routerLink]="['/admin/devices/edit', device.id.toString()]"
                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all">
                        <span class="material-symbols-outlined text-lg">edit_square</span>
                    </button>
                    <button
                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-all">
                        <span class="material-icons-outlined text-lg">delete</span>
                    </button>
                </div>
            </td>
        </tr>
    </ng-template>
</app-management-layout>

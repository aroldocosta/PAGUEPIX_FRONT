<app-management-layout title="Gestão de Placas" subtitle="Gerencie módulos de hardware e controle de dispositivos."
    searchPlaceholder="Buscar placas..." addButtonLabel="Adicionar Placa" addButtonIcon="developer_board"
    addRoute="/admin/boards/new" [loading]="loading" [hasData]="hasData" emptyStateIcon="memory_off"
    emptyStateMessage="Nenhuma placa encontrada.">

    <div headerActions class="flex items-center gap-2">
        <label for="partnerFilter" class="text-xs font-bold text-slate-400 uppercase tracking-widest hidden lg:block">Filtrar:</label>
        <select id="partnerFilter" [(ngModel)]="selectedPartnerId" 
            class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all outline-none">
            <option value="all">Todos os Parceiros</option>
            <option *ngFor="let p of partners()" [value]="p.id">{{ p.name }}</option>
        </select>
    </div>

    <ng-template #tableHeader>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Hardware(Board)
        </th>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Modelo
        </th>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Script Ativo
        </th>
        <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
            Proprietário
        </th>
        <th
            class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-center">
            Ações</th>
    </ng-template>

    <ng-template #tableRow>
        <tr *ngFor="let board of filteredBoards()"
            class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
            <td class="px-8 py-0.5">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-50 to-blue-50 dark:from-slate-800 dark:to-slate-700 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-xs font-bold ring-1 ring-cyan-100 dark:ring-slate-700">
                        <span class="material-icons-outlined text-lg">memory</span>
                    </div>
                    <div class="text-sm font-medium text-gray-600 dark:text-slate-400 font-mono">
                        {{ board.clientId }}
                    </div>
                </div>
            </td>
            <td class="px-8 py-0.5">
                <div class="text-sm font-bold text-gray-900 dark:text-slate-200">{{
                    board.model || 'N/A' }}</div>
                <div class="text-[10px] text-gray-400 dark:text-slate-500 font-mono">ID: #{{
                    board.id }}</div>
            </td>
            <td class="px-8 py-0.5">
                <span class="text-sm font-medium text-blue-600 dark:text-blue-400">{{
                    board.script?.name || 'Nenhum' }}</span>
            </td>
            <td class="px-8 py-0.5 text-sm text-gray-500 dark:text-slate-400">
                {{ board.partner?.name || 'Sistema' }}
            </td>
            <td class="px-8 py-0.5 text-center">
                <div class="flex items-center justify-center gap-2">
                    <button (click)="onView(board)"
                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all"
                        title="Ver Detalhes">
                        <span class="material-icons-outlined text-lg">visibility</span>
                    </button>
                    <button (click)="onEdit(board.id)"
                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 rounded-lg transition-all"
                        title="Editar">
                        <span class="material-symbols-outlined text-lg">edit_square</span>
                    </button>
                    <button (click)="onDelete(board.id)"
                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-all"
                        title="Excluir">
                        <span class="material-icons-outlined text-lg">delete</span>
                    </button>
                </div>
            </td>
        </tr>
    </ng-template>
</app-management-layout>

<app-board-detail *ngIf="selectedBoard()" [board]="selectedBoard()!" (close)="selectedBoard.set(null)">
</app-board-detail>

<app-delete-modal *ngIf="showDeleteModal()" [objectName]="boardToDelete()?.clientId || ''"
    alertMessage="Todas as configurações de hardware e vínculos com dispositivos serão removidos."
    [loading]="isDeleting()" (confirm)="confirmDelete()" (cancel)="closeDeleteModal()">
</app-delete-modal>

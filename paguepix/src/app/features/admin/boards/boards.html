<div class="flex h-screen bg-gray-50 dark:bg-slate-950 font-sans">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <app-topbar searchPlaceholder="Buscar placas..."></app-topbar>

        <main class="flex-1 overflow-y-auto p-4 md:p-10">
            <header class="flex items-center justify-between mb-10">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Gestão de Placas
                    </h1>
                    <p class="text-gray-500 dark:text-slate-400 mt-1">Gerencie módulos de hardware, firmwares e
                        integridade física dos dispositivos.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="bg-blue-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-700 shadow-md shadow-blue-200 dark:shadow-none transition-all flex items-center gap-2">
                        <span class="material-icons-outlined text-sm">developer_board</span> Registrar Placa
                    </button>
                </div>
            </header>

            <!-- Boards Table -->
            <div
                class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-800 ring-1 ring-gray-900/5 dark:ring-white/10 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead
                            class="bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800">
                            <tr>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Modelo / Hardware
                                </th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Nº de Série</th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Firmware
                                </th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Status
                                </th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Uptime</th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-right">
                                    Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
                            <tr *ngFor="let board of boards()"
                                class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
                                <td class="px-8 py-5">
                                    <div class="flex items-center gap-4">
                                        <div
                                            class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-50 to-blue-50 dark:from-slate-800 dark:to-slate-700 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-xs font-bold ring-1 ring-cyan-100 dark:ring-slate-700">
                                            <span class="material-icons-outlined text-lg">memory</span>
                                        </div>
                                        <div>
                                            <div class="text-sm font-bold text-gray-900 dark:text-slate-200">{{
                                                board.model }}</div>
                                            <div
                                                class="text-[10px] text-gray-400 dark:text-slate-500 font-bold uppercase tracking-wider">
                                                Armazenamento: {{ board.storage }}</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-8 py-5 text-sm font-mono text-gray-600 dark:text-slate-400">
                                    {{ board.serial }}
                                </td>
                                <td class="px-8 py-5">
                                    <span class="text-sm font-medium text-gray-700 dark:text-slate-300">{{
                                        board.firmware }}</span>
                                </td>
                                <td class="px-8 py-5">
                                    <span [ngClass]="{
                                            'bg-green-50 text-green-700 ring-1 ring-green-600/10': board.status === 'Active',
                                            'bg-amber-50 text-amber-700 ring-1 ring-amber-600/10': board.status === 'Maintenance',
                                            'bg-gray-50 text-gray-500 ring-1 ring-gray-600/10': board.status === 'Offline'
                                        }"
                                        class="px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">
                                        <span class="w-1 h-1 rounded-full" [ngClass]="{
                                                'bg-green-600': board.status === 'Active',
                                                'bg-amber-600': board.status === 'Maintenance',
                                                'bg-gray-400': board.status === 'Offline'
                                            }"></span>
                                        {{ board.status }}
                                    </span>
                                </td>
                                <td class="px-8 py-5 text-sm text-gray-500 dark:text-slate-400">{{ board.uptime }}</td>
                                <td class="px-8 py-5 text-right">
                                    <div class="flex items-center justify-end gap-2">
                                        <button
                                            class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all">
                                            <span class="material-icons-outlined text-lg">terminal</span>
                                        </button>
                                        <button
                                            class="p-2 text-gray-400 dark:text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-all">
                                            <span class="material-icons-outlined text-lg">update</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-10">
                <app-footer></app-footer>
            </div>
        </main>
    </div>
</div>

<app-management-layout [title]="id() ? 'Editar Parceiro' : 'Adicionar Parceiro'"
    [subtitle]="id() ? 'Altere as informações da empresa selecionada.' : 'Cadastre uma nova empresa na plataforma.'"
    [loading]="loading" [hasData]="hasData">

    <ng-template #tableContent>
        <div class="p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulário de Edição -->
            <form (ngSubmit)="onSave()"
                class="lg:col-span-2 space-y-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm h-fit">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Nome -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="name" class="block text-sm font-bold text-gray-700 dark:text-slate-300">
                            Nome Fantasia / Razão Social
                        </label>
                        <div class="relative group">
                            <span
                                class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors">store</span>
                            <input id="name" name="name" type="text" [ngModel]="name()"
                                (ngModelChange)="name.set($event)" required
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-900 dark:text-white"
                                placeholder="Ex: Loja do João Ltda">
                        </div>
                    </div>

                    <!-- CNPJ/Descrição -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="description" class="block text-sm font-bold text-gray-700 dark:text-slate-300">
                            Documento (CNPJ/CPF) ou Descrição
                        </label>
                        <div class="relative group">
                            <span
                                class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors">description</span>
                            <input id="description" name="description" type="text" [ngModel]="description()"
                                (ngModelChange)="description.set($event)"
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-900 dark:text-white"
                                placeholder="Ex: 00.000.000/0001-00">
                        </div>
                    </div>

                    <!-- Gateway Bancário -->
                    <div class="space-y-2">
                        <label for="gateway" class="block text-sm font-bold text-gray-700 dark:text-slate-300">
                            Gateway Bancário
                        </label>
                        <div class="relative group">
                            <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors">account_balance</span>
                            <select id="gateway" name="gateway" [ngModel]="gateway()" (ngModelChange)="gateway.set($event)" required
                                class="w-full pl-10 pr-10 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-900 dark:text-white appearance-none">
                                <option value="" disabled selected>Selecione um gateway</option>
                                <option *ngFor="let g of gateways()" [value]="g.code">{{ g.name }}</option>
                            </select>
                            <span class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>

                    <!-- Chave Pix -->
                    <div class="space-y-2">
                        <label for="pixKey" class="block text-sm font-bold text-gray-700 dark:text-slate-300">
                            Chave Pix Recebedora
                        </label>
                        <div class="relative group">
                            <span
                                class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-emerald-500 transition-colors">qr_code_2</span>
                            <input id="pixKey" name="pixKey" type="text" [ngModel]="pixKey()"
                                (ngModelChange)="pixKey.set($event)"
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all text-gray-900 dark:text-white"
                                placeholder="E-mail, CPF ou Aleatória">
                        </div>
                    </div>

                    <!-- Taxa da Plataforma -->
                    <div class="space-y-2">
                        <label for="commissionRate" class="block text-sm font-bold text-gray-700 dark:text-slate-300">
                            Taxa da Plataforma (%)
                        </label>
                        <div class="relative group">
                            <span
                                class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors">percent</span>
                            <input id="commissionRate" name="commissionRate" type="number" step="0.01"
                                [ngModel]="commissionRate()" (ngModelChange)="commissionRate.set($event)"
                                class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-900 dark:text-white"
                                placeholder="Ex: 5.5">
                        </div>
                    </div>
                </div>

                <!-- Ações -->
                <div class="flex items-center gap-4 pt-4 border-t border-slate-100 dark:border-slate-800 mt-6">
                    <button type="submit" [disabled]="loading() || !name()"
                        class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-8 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-sm">
                        <span class="material-icons-outlined text-lg">save</span>
                        Salvar Alterações
                    </button>
                    <button type="button" routerLink="/admin/partners"
                        class="px-8 py-3 rounded-xl font-bold text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all">
                        Cancelar
                    </button>
                </div>
            </form>

            <!-- Card de Upload de Logo -->
            <div class="space-y-6">
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm text-center">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">Logo do Parceiro</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mb-8">Esta imagem aparecerá no topo do
                        dashboard do parceiro.</p>

                    <div class="flex justify-center mb-6">
                        <div
                            class="w-full h-40 p-4 rounded-3xl border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden bg-slate-50 dark:bg-slate-800/50 relative group">
                            <img *ngIf="logo() && !imageError()" [src]="logo()" class="w-full h-full object-contain"
                                (error)="imageError.set(true)">
                            <span *ngIf="!logo() || imageError()"
                                class="material-icons-outlined text-4xl text-slate-300 dark:text-slate-600">store</span>
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all cursor-pointer"
                                (click)="triggerFileInput(logoInput)">
                                <span class="material-icons-outlined text-white text-3xl">upload</span>
                            </div>
                        </div>
                    </div>

                    <input #logoInput type="file" id="logoInput"
                        class="opacity-0 absolute inset-0 pointer-events-none w-px h-px overflow-hidden -z-10"
                        accept="image/*" (change)="onFileSelected($event)">

                    <button type="button" (click)="triggerFileInput(logoInput)"
                        class="w-full flex items-center justify-center gap-3 py-4 rounded-2xl bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-all">
                        <span class="material-icons-outlined">image</span>
                        Selecionar Imagem
                    </button>
                </div>

                <div
                    class="bg-indigo-50 dark:bg-indigo-900/20 p-6 rounded-3xl border border-indigo-100 dark:border-indigo-900/30">
                    <div class="flex gap-3 text-indigo-700 dark:text-indigo-400">
                        <span class="material-icons-outlined text-xl">info</span>
                        <div class="text-sm leading-relaxed">
                            <strong>Dica PaguePix:</strong> Para melhores resultados, utilize imagens retangulares
                            (proporção 3:1, ex: 300x100px) com fundo transparente (.PNG).
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</app-management-layout>

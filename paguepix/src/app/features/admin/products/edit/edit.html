<div
    class="flex flex-col h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 overflow-hidden transition-colors duration-300">

    <app-topbar></app-topbar>

    <div class="max-w-[1660px] mx-auto w-full px-4 flex flex-1 overflow-hidden mt-6 gap-6">

        <aside class="w-72 flex-shrink-0 flex flex-col gap-6 hidden lg:flex h-full pb-6">
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] p-6 flex flex-col items-center justify-center shadow-sm">
                <h2 class="text-2xl font-black text-slate-900 dark:text-slate-100 tracking-tight">Produtos</h2>
                <span
                    class="text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mt-1">Gestão
                    de Banhos</span>
            </div>

            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] overflow-hidden flex-1 shadow-sm flex flex-col">
                <app-sidebar class="flex-1 overflow-y-auto"></app-sidebar>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto pb-10 pr-2">
            <div class="w-full">
                <header class="mb-10">
                    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                        {{ id() ? (mode() === 'edit' ? 'Editar Produto' : 'Detalhes do Produto') : 'Novo Produto' }}
                    </h1>
                    <p class="text-slate-500 dark:text-slate-400 mt-1 font-medium">
                        {{ mode() === 'edit' ? 'Preencha as informações para salvar as alterações.' : 'Confira os
                        detalhes cadastrados para este produto.' }}
                    </p>
                </header>

                <div
                    class="bg-white dark:bg-slate-900 rounded-[40px] p-10 shadow-sm border border-slate-100 dark:border-slate-800 ring-1 ring-slate-900/5 dark:ring-white/10">

                    <div *ngIf="loading() && !productData() && id()"
                        class="py-20 flex flex-col items-center justify-center space-y-4">
                        <div
                            class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin">
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 font-bold tracking-wide">Carregando dados...</p>
                    </div>

                    <app-product-form *ngIf="!loading() || productData() || !id()" [id]="id()"
                        [name]="productData()?.name || ''" [duration]="productData()?.duration || 0"
                        [durationUnit]="productData()?.durationUnit || 'MINUTES'" [price]="productData()?.price || 0"
                        [active]="productData()?.active ?? true" [mode]="mode()" [loading]="loading()"
                        (save)="onSave($event)" (cancel)="onCancel()">
                    </app-product-form>
                </div>

                <div class="mt-12">
                    <app-footer></app-footer>
                </div>
            </div>
        </main>
    </div>
</div>

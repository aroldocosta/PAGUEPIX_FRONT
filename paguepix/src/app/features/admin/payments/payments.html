<div class="flex h-screen bg-gray-50 dark:bg-slate-950 font-sans">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <app-topbar searchPlaceholder="Buscar pagamentos..."></app-topbar>

        <main class="flex-1 overflow-y-auto p-4 md:p-10">
            <header class="flex items-center justify-between mb-10">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Gestão de
                        Pagamentos</h1>
                    <p class="text-gray-500 dark:text-slate-400 mt-1">Monitore e gerencie todos os recebimentos via Pix
                        em tempo real.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="bg-white dark:bg-slate-800 text-gray-700 dark:text-slate-300 border border-gray-200 dark:border-slate-700 px-5 py-2 rounded-xl text-sm font-bold hover:bg-gray-50 dark:hover:bg-slate-700 transition-all flex items-center gap-2 shadow-sm">
                        <span class="material-icons-outlined text-sm">filter_list</span> Filtros
                    </button>
                    <button
                        class="bg-blue-600 text-white px-6 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 shadow-md shadow-blue-200 transition-all flex items-center gap-2">
                        <span class="material-icons-outlined text-sm">file_download</span> Exportar
                    </button>
                </div>
            </header>

            <!-- Transactions Table -->
            <div
                class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-800 ring-1 ring-gray-900/5 dark:ring-white/10 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead
                            class="bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800">
                            <tr>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    ID
                                    Transação</th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Parceiro
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Método
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Valor
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 uppercase tracking-wider">Data
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Status
                                </th>
                                <th
                                    class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-right">
                                    Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
                            <tr *ngFor="let payment of payments()"
                                class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
                                <td class="px-8 py-5 text-sm font-medium text-gray-900 dark:text-slate-200">{{
                                    payment.id }}</td>
                                <td class="px-8 py-5 text-sm text-gray-600 dark:text-slate-400 font-medium">{{
                                    payment.partner }}</td>
                                <td class="px-8 py-5">
                                    <div class="flex items-center gap-2">
                                        <span
                                            class="p-1 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded">
                                            <span class="material-icons-outlined text-xs">qr_code</span>
                                        </span>
                                        <span class="text-sm text-gray-600 dark:text-slate-400">{{ payment.method
                                            }}</span>
                                    </div>
                                </td>
                                <td class="px-8 py-5 text-sm font-bold text-gray-900 dark:text-slate-200">{{
                                    payment.amount | currency:'BRL'
                                    }}
                                </td>
                                <td class="px-8 py-5 text-sm text-gray-500 dark:text-slate-400">{{ payment.date }}</td>
                                <td class="px-8 py-5">
                                    <span [ngClass]="{
                        'bg-green-50 text-green-700 ring-1 ring-green-600/10': payment.status === 'Success',
                        'bg-yellow-50 text-yellow-700 ring-1 ring-yellow-600/10': payment.status === 'Pending',
                        'bg-red-50 text-red-700 ring-1 ring-red-600/10': payment.status === 'Failed'
                      }" class="px-2.5 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">
                                        <span class="w-1 h-1 rounded-full" [ngClass]="{
                            'bg-green-600': payment.status === 'Success',
                            'bg-yellow-600': payment.status === 'Pending',
                            'bg-red-600': payment.status === 'Failed'
                        }"></span>
                                        {{ payment.status }}
                                    </span>
                                </td>
                                <td class="px-8 py-5 text-right">
                                    <button
                                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all">
                                        <span class="material-icons-outlined text-lg">visibility</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-10">
                <app-footer></app-footer>
            </div>
        </main>
    </div>
</div>

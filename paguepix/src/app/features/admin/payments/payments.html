<app-management-layout title="Gestão de Pagamentos" subtitle="Monitore e gerencie todos os recebimentos em tempo real."
    searchPlaceholder="Buscar pagamentos..." [loading]="loading" [hasData]="hasData" emptyStateIcon="history_toggle_off"
    emptyStateMessage="Nenhum pagamento encontrado.">

    <ng-template #tableContent>
        <div
            class="flex items-center gap-4 mb-6 px-8 py-4 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800">
            <button
                class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-5 py-2 rounded-xl text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all flex items-center gap-2 shadow-sm">
                <span class="material-icons-outlined text-sm">filter_list</span> Filtros
            </button>
            <button
                class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-6 py-2 rounded-xl text-sm font-bold shadow-sm transition-all flex items-center gap-2">
                <span class="material-icons-outlined text-sm">file_download</span> Exportar
            </button>

            <div
                class="ml-auto flex items-center gap-4 text-sm bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-1">
                <ng-container *ngIf="totalPages() > 1">
                    <span class="font-medium text-slate-500 dark:text-slate-400 pl-2 pr-1">
                        Página {{ currentPage() + 1 }} de {{ totalPages() }}
                    </span>
                    <div class="flex items-center gap-1.5 p-0.5">
                        <button (click)="prevPage()" [disabled]="currentPage() === 0"
                            class="p-1.5 flex items-center justify-center rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                            <span class="material-icons-outlined text-sm">chevron_left</span>
                        </button>
                        <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>
                        <button (click)="nextPage()" [disabled]="currentPage() >= totalPages() - 1"
                            class="p-1.5 flex items-center justify-center rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                            <span class="material-icons-outlined text-sm">chevron_right</span>
                        </button>
                    </div>
                </ng-container>
            </div>
        </div>

        <app-payment-list [payments]="payments()" mode="admin"></app-payment-list>
    </ng-template>

</app-management-layout>

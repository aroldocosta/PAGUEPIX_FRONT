<app-management-layout title="Gestão de Usuários" subtitle="Gerencie administradores, permissões e acessos ao sistema."
    searchPlaceholder="Buscar usuários..." addButtonLabel="Adicionar Usuário" addButtonIcon="person_add"
    addRoute="/admin/users/new" [loading]="loading" [hasData]="hasData" emptyStateIcon="person_off"
    emptyStateMessage="Nenhum usuário encontrado.">

    <div headerActions class="flex items-center gap-2">
        <label for="partnerFilter" class="text-xs font-bold text-slate-400 uppercase tracking-widest hidden lg:block">Filtrar:</label>
        <select id="partnerFilter" [(ngModel)]="selectedPartnerId" (change)="onPartnerChange()"
            class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all outline-none">
            <option value="all">Todos os Parceiros</option>
            <option *ngFor="let p of partners()" [value]="p.id">{{ p.name }}</option>
        </select>
    </div>

    <ng-template #tableContent>
        <!-- Paginação -->
        <div *ngIf="totalPages() > 1"
            class="flex items-center gap-4 mb-6 px-8 py-4 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800">
            <div
                class="ml-auto flex items-center gap-4 text-sm bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-1">
                <span class="font-medium text-slate-500 dark:text-slate-400 pl-2 pr-1">
                    Página {{ currentPage() + 1 }} de {{ totalPages() }}
                </span>
                <div class="flex items-center gap-1.5 p-0.5">
                    <button (click)="prevPage()" [disabled]="currentPage() === 0"
                        class="p-1.5 flex items-center justify-center rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                        <span class="material-icons-outlined text-sm">chevron_left</span>
                    </button>
                    <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>
                    <button (click)="nextPage()" [disabled]="currentPage() >= totalPages() - 1"
                        class="p-1.5 flex items-center justify-center rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                        <span class="material-icons-outlined text-sm">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>

        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800">
                <tr>
                    <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                        Usuário
                    </th>
                    <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                        Login</th>
                    <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                        Perfil
                    </th>
                    <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                        Parceiro
                    </th>
                    <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-center">
                        Ações</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
                <tr *ngFor="let user of filteredUsers()" class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
                    <td class="px-8 py-0.5">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-50 to-blue-50 dark:from-slate-800 dark:to-slate-700 text-indigo-600 dark:text-indigo-400 flex items-center justify-center ring-1 ring-indigo-100 dark:ring-slate-700">
                                <span class="material-icons-outlined text-xl">group</span>
                            </div>
                            <div>
                                <div class="text-sm font-bold text-gray-900 dark:text-slate-200">{{
                                    user.name }}</div>
                                <div class="text-xs text-gray-500 dark:text-slate-400">ID: #{{ user.id }}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-0.5 text-sm text-gray-600 dark:text-slate-400">
                        <span
                            class="px-2 py-1 bg-gray-100 dark:bg-slate-800 rounded-md text-xs font-medium text-gray-600 dark:text-slate-300">{{
                            user.login }}</span>
                    </td>
                    <td class="px-8 py-0.5">
                        <span class="text-sm font-bold text-gray-700 dark:text-slate-300"
                            [ngClass]="user.role === 'ADMIN' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500 dark:text-slate-400'">
                            {{ user.role === 'ADMIN' ? 'ADMIN' : 'PARTNER' }}
                        </span>
                    </td>
                    <td class="px-8 py-0.5">
                        <span class="text-sm font-medium text-gray-600 dark:text-slate-400">
                            {{ user.partner?.name || 'Sistema' }}
                        </span>
                    </td>
                    <td class="px-8 py-0.5 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button (click)="onView(user)"
                                class="p-2 text-gray-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 rounded-lg transition-all">
                                <span class="material-icons-outlined text-lg">visibility</span>
                            </button>
                            <button [routerLink]="['/admin/users/edit', user.id.toString()]"
                                class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all">
                                <span class="material-symbols-outlined text-lg">edit_square</span>
                            </button>
                            <button (click)="onDelete(user.id)"
                                class="p-2 text-gray-400 dark:text-slate-500 hover:text-red-600 dark:hover:text-rose-400 hover:bg-red-50 dark:hover:bg-rose-900/20 rounded-lg transition-all">
                                <span class="material-icons-outlined text-lg">delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </ng-template>

</app-management-layout>

<app-user-detail *ngIf="selectedUser()" [user]="selectedUser()!" (close)="onCloseDetail()">
</app-user-detail>

<app-delete-modal *ngIf="showDeleteModal()" [objectName]="userToDelete()?.name || ''"
    alertMessage="O usuário perderá acesso imediato à plataforma." [loading]="isDeleting()" (confirm)="confirmDelete()"
    (cancel)="closeDeleteModal()">
</app-delete-modal>

<div
    class="flex flex-col h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 overflow-hidden transition-colors duration-300">

    <!-- Top Bar Full Width -->
    <app-topbar searchPlaceholder="Buscar vendas.."></app-topbar>

    <!-- Boxed Content Area -->
    <div class="max-w-[1660px] mx-auto w-full px-4 flex flex-1 overflow-hidden mt-6 gap-6">

        <!-- Left Column: Partner Logo + Sidebar -->
        <aside class="w-72 flex-shrink-0 flex flex-col gap-6 hidden lg:flex h-full pb-6">

            <!-- Partner Logo Card -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] p-6 flex flex-col items-center justify-center shadow-sm">
                <h2 class="text-2xl font-black text-slate-900 dark:text-slate-100 tracking-tight">{{ partnerName() ||
                    'Parceiro' }}</h2>
                <span
                    class="text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mt-1">Logo
                    do Parceiro</span>
            </div>

            <!-- Sidebar Container -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] overflow-hidden flex-1 shadow-sm flex flex-col">
                <app-sidebar class="flex-1 overflow-y-auto"></app-sidebar>
            </div>

        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto pb-10 pr-2 pt-2">
            <header class="flex items-center justify-between mb-5">
                <div>
                    <h1 class="text-[1.05rem] md:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">
                        Vendas</h1>
                    <p class="text-[0.7rem] md:text-base text-gray-500 dark:text-slate-400 mt-1">Acompanhe todos os seus
                        recebimentos Pix em tempo real.</p>
                </div>
                <div class="flex items-center gap-4 text-sm">
                    <ng-container *ngIf="totalPages() > 1 && !loading()">
                        <span class="font-medium text-gray-500 dark:text-slate-400">
                            Página {{ currentPage() + 1 }} de {{ totalPages() }}
                        </span>
                        <div
                            class="flex items-center gap-1.5 border border-gray-200 dark:border-slate-700 rounded-lg p-0.5 bg-white dark:bg-slate-900 shadow-sm">
                            <button (click)="prevPage()" [disabled]="currentPage() === 0"
                                class="p-1.5 flex items-center justify-center rounded-md text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                                <span class="material-icons-outlined text-sm">chevron_left</span>
                            </button>
                            <div class="w-px h-4 bg-gray-200 dark:bg-slate-700"></div>
                            <button (click)="nextPage()" [disabled]="currentPage() >= totalPages() - 1"
                                class="p-1.5 flex items-center justify-center rounded-md text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                                <span class="material-icons-outlined text-sm">chevron_right</span>
                            </button>
                        </div>
                    </ng-container>
                </div>
            </header>

            <!-- Sales Table -->
            <div
                class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-800 ring-1 ring-gray-900/5 dark:ring-white/10 overflow-hidden">

                <div class="overflow-x-auto">
                    <!-- Loading State -->
                    <div *ngIf="loading()" class="p-12 flex flex-col items-center justify-center space-y-4">
                        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin">
                        </div>
                        <p class="text-gray-500 dark:text-slate-400 font-medium">Carregando vendas...</p>
                    </div>

                    <!-- Empty State -->
                    <div *ngIf="!loading() && sales().length === 0" class="p-12 text-center">
                        <span
                            class="material-icons-outlined text-4xl text-gray-300 dark:text-slate-700 mb-2">history_toggle_off</span>
                        <p class="text-gray-500 dark:text-slate-400">Nenhuma venda encontrada.</p>
                    </div>

                    <app-payment-list *ngIf="!loading() && sales().length > 0" [payments]="sales()"
                        mode="user"></app-payment-list>
                </div>
            </div>

            <div class="mt-10">
                <app-footer></app-footer>
            </div>
        </main>
    </div>
</div>

<div class="flex h-screen bg-gray-50 dark:bg-slate-950 font-sans">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <app-topbar searchPlaceholder="Buscar no histórico..."></app-topbar>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <header class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Payment History</h1>
                    <p class="text-sm text-gray-500 dark:text-slate-400 mt-1">View and filter all your received Pix
                        payments.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="px-4 py-2 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-lg text-sm font-medium text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700 flex items-center gap-2">
                        <span class="material-icons-outlined text-sm">filter_alt</span> Filter
                    </button>
                </div>
            </header>

            <!-- Search and Table -->
            <div
                class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-gray-100 dark:border-slate-800 overflow-hidden">
                <div class="p-6 border-b border-gray-100 dark:border-slate-800 bg-gray-50 dark:bg-slate-800/50">
                    <div class="relative max-w-md">
                        <span
                            class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 dark:text-slate-500">
                            <span class="material-icons-outlined text-sm">search</span>
                        </span>
                        <input type="text" placeholder="Search by ID or description..."
                            class="block w-full pl-10 pr-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-sm focus:ring-blue-500 focus:border-blue-500 dark:text-slate-200">
                    </div>
                </div>
                <table class="w-full text-left">
                    <thead
                        class="bg-gray-50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Transaction</th>
                            <th class="px-6 py-4">Date & Time</th>
                            <th class="px-6 py-4">Amount</th>
                            <th class="px-6 py-4">Fees</th>
                            <th class="px-6 py-4">Net</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
                        <tr *ngFor="let txn of history()"
                            class="hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-slate-200">#{{ txn.id }}
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500 dark:text-slate-400">{{ txn.date }}</td>
                            <td class="px-6 py-4 text-sm font-bold text-gray-900 dark:text-slate-200">{{ txn.amount |
                                currency:'BRL' }}</td>
                            <td class="px-6 py-4 text-sm text-red-500">- {{ txn.fees | currency:'BRL' }}</td>
                            <td class="px-6 py-4 text-sm font-bold text-green-600">{{ (txn.amount - txn.fees) |
                                currency:'BRL' }}</td>
                            <td class="px-6 py-4 text-right">
                                <button
                                    class="text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400">
                                    <span class="material-icons-outlined text-lg">receipt</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-10">
                <app-footer></app-footer>
            </div>
        </main>
    </div>
</div>

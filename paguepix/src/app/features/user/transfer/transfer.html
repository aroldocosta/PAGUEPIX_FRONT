<div class="flex h-screen bg-gray-50 dark:bg-slate-950 font-sans">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <app-topbar searchPlaceholder="Realizar transferência..."></app-topbar>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <header class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Request Payout</h1>
                <p class="text-sm text-gray-500 dark:text-slate-400 mt-1">Transfer your available balance to your
                    registered Pix key.</p>
            </header>

            <div class="max-w-2xl">
                <!-- Balance Card -->
                <div
                    class="bg-blue-600 rounded-2xl p-8 text-white mb-8 relative overflow-hidden shadow-lg shadow-blue-200 dark:shadow-none">
                    <div class="relative z-10">
                        <p class="text-blue-100 text-sm font-medium mb-1">Available for Payout</p>
                        <h2 class="text-4xl font-bold">{{ availableBalance() | currency:'BRL' }}</h2>
                    </div>
                    <!-- Abstract background shapes -->
                    <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-blue-500 rounded-full opacity-50">
                    </div>
                    <div class="absolute bottom-0 left-0 -ml-12 -mb-12 w-32 h-32 bg-blue-400 rounded-full opacity-30">
                    </div>
                </div>

                <!-- Payout Form -->
                <div
                    class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-gray-100 dark:border-slate-800 p-8">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-2">Pix Key
                                (Registered)</label>
                            <div
                                class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-slate-800 rounded-xl border border-gray-100 dark:border-slate-700">
                                <span
                                    class="material-icons-outlined text-gray-400 dark:text-slate-500">account_balance</span>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-gray-900 dark:text-slate-200">Nubank -
                                        ***.123.456-**</p>
                                    <p class="text-xs text-gray-500 dark:text-slate-400">Savings Account</p>
                                </div>
                                <span class="material-icons-outlined text-green-500">verified</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-slate-300 mb-2">Amount to
                                Transfer (R$)</label>
                            <div class="relative">
                                <span
                                    class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 dark:text-slate-500 font-bold">R$</span>
                                <input type="number"
                                    class="block w-full pl-12 pr-4 py-4 bg-gray-50 dark:bg-slate-800 border-0 rounded-xl focus:ring-2 focus:ring-blue-500 text-2xl font-bold text-gray-900 dark:text-white"
                                    [value]="availableBalance()" placeholder="0,00">
                            </div>
                            <p class="mt-2 text-xs text-gray-500 dark:text-slate-400 flex items-center gap-1">
                                <span class="material-icons-outlined text-xs">info</span>
                                Transfers are usually processed within 15 minutes.
                            </p>
                        </div>

                        <button
                            class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md shadow-blue-100 dark:shadow-none">
                            Confirm Payout
                        </button>

                        <button
                            class="w-full text-center text-sm font-medium text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300">
                            Cancel and return to dashboard
                        </button>
                    </div>
                </div>

                <div class="mt-10">
                    <app-footer></app-footer>
                </div>
            </div>
        </main>
    </div>
</div>

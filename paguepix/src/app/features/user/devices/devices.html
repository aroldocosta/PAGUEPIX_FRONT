<div
    class="flex flex-col h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 overflow-hidden transition-colors duration-300">

    <!-- Top Bar Full Width -->
    <app-topbar searchPlaceholder="Buscar dispositivos..."></app-topbar>

    <!-- Boxed Content Area -->
    <div class="max-w-[1660px] mx-auto w-full px-4 flex flex-1 overflow-hidden mt-6 gap-6">

        <!-- Left Column: Partner Logo + Sidebar -->
        <aside class="w-72 flex-shrink-0 flex flex-col gap-6 hidden lg:flex h-full pb-6">

            <!-- Partner Logo Card -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] p-6 flex flex-col items-center justify-center shadow-sm">
                <h2 class="text-2xl font-black text-slate-900 dark:text-slate-100 tracking-tight">{{ partnerName() ||
                    'Parceiro' }}</h2>
                <span
                    class="text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mt-1">Logo
                    do Parceiro</span>
            </div>

            <!-- Sidebar Container -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] overflow-hidden flex-1 shadow-sm flex flex-col">
                <app-sidebar class="flex-1 overflow-y-auto"></app-sidebar>
            </div>

        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto pb-10 pr-2 pt-2">
            <header class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-[1.05rem] md:text-4xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight">
                        Meus Dispositivos</h1>
                    <p class="text-[0.7rem] md:text-base text-slate-500 dark:text-slate-400 mt-1 font-medium">
                        Gerencie os equipamentos vinculados à sua empresa.
                    </p>
                </div>
            </header>

            <!-- Table Container -->
            <div
                class="bg-white dark:bg-slate-900 rounded-[32px] shadow-sm border border-slate-100 dark:border-slate-800 ring-1 ring-slate-900/5 dark:ring-white/10 overflow-hidden">
                <div class="overflow-x-auto">
                    <!-- Loading State -->
                    <div *ngIf="loading()" class="p-16 flex flex-col items-center justify-center space-y-4">
                        <div
                            class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin">
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 font-bold tracking-wide">Carregando dispositivos...</p>
                    </div>

                    <!-- Empty State -->
                    <div *ngIf="!loading() && !hasData()" class="p-16 text-center">
                        <span class="material-icons-outlined text-5xl text-slate-200 dark:text-slate-800 mb-4">no_sim</span>
                        <p class="text-slate-500 dark:text-slate-400 font-bold">Nenhum dispositivo encontrado.</p>
                    </div>

                    <!-- Table content -->
                    <table *ngIf="!loading() && hasData()" class="w-full text-left border-collapse">
                        <thead class="bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800">
                            <tr>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Dispositivo / Código
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">
                                    Modelo
                                </th>
                                <th class="px-8 py-5 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider text-right">
                                    Ações
                                </th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
                            <tr *ngFor="let device of devices()" class="hover:bg-gray-50/80 dark:hover:bg-slate-800/50 transition-colors group">
                                <td class="px-8 py-4">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-50 to-blue-50 dark:from-slate-800 dark:to-slate-700 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold ring-1 ring-indigo-100 dark:ring-slate-700">
                                            <span class="material-icons-outlined text-lg">devices</span>
                                        </div>
                                        <div>
                                            <div class="text-sm font-bold text-gray-900 dark:text-slate-200">{{ device.code }}</div>
                                            <div class="text-[10px] text-gray-400 dark:text-slate-500 font-mono">ID: #{{ device.id }}</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-8 py-4 text-sm font-medium text-gray-600 dark:text-slate-400">
                                    {{ device.model }}
                                </td>
                                <td class="px-8 py-4 text-right">
                                    <button [routerLink]="['/user/devices/view', device.id.toString()]"
                                        class="p-2 text-gray-400 dark:text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all"
                                        title="Ver Detalhes">
                                        <span class="material-icons-outlined text-lg">visibility</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-12">
                <app-footer></app-footer>
            </div>
        </main>
    </div>

</div>

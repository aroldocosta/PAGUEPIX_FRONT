<!-- ============ MOBILE DRAWER OVERLAY ============ -->
<div *ngIf="open()" class="fixed inset-0 z-40 lg:hidden" (click)="onClose()">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
</div>

<!-- Drawer Panel -->
<div [class.translate-x-0]="open()" [class.translate-x-full]="!open()"
    class="fixed top-0 right-0 h-full w-72 z-50 lg:hidden bg-white dark:bg-slate-900 shadow-2xl flex flex-col transition-transform duration-300 ease-in-out">

    <!-- Drawer Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 dark:border-slate-800">
        <div>
            <p class="text-sm font-bold text-slate-900 dark:text-slate-100 leading-none">{{ userName() }}</p>
            <p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 mt-1 uppercase tracking-wider">
                {{ partnerName() }}</p>
        </div>
        <button (click)="onClose()"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
            <span class="material-icons-outlined text-xl">close</span>
        </button>
    </div>

    <!-- Nav Items -->
    <nav class="flex-1 overflow-y-auto px-4 py-4 space-y-6">
        <div *ngFor="let category of menuCategories()" class="space-y-2">
            <!-- Category Header (Toggle) -->
            <button (click)="toggleCategory(category.label)"
                class="w-full px-4 text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center justify-between gap-2 mb-2 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                <span class="flex items-center gap-2">
                    <span class="material-icons-outlined text-base">{{ category.icon }}</span>
                    {{ category.label }}
                </span>
                <span class="material-icons-outlined text-sm transition-transform duration-300"
                    [class.rotate-180]="expandedCategories().has(category.label)">
                    expand_more
                </span>
            </button>

            <!-- Menu Items -->
            <div *ngIf="expandedCategories().has(category.label)" class="space-y-1 pl-6">
                <a *ngFor="let item of category.items" (click)="item.disabled ? null : navigate(item.route)"
                    [class.bg-indigo-50]="isActive(item.route) && !item.disabled"
                    [class.dark:bg-indigo-950]="isActive(item.route) && !item.disabled"
                    [class.text-indigo-600]="isActive(item.route) && !item.disabled"
                    [class.border-l-4]="isActive(item.route) && !item.disabled"
                    [class.border-indigo-500]="isActive(item.route) && !item.disabled"
                    [class.opacity-50]="item.disabled" [class.cursor-not-allowed]="item.disabled"
                    class="flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all cursor-pointer">
                    <span class="material-icons-outlined text-xl"
                        [class.text-indigo-600]="isActive(item.route) && !item.disabled">{{ item.icon }}</span>
                    {{ item.label }}
                </a>
            </div>
        </div>
    </nav>

    <!-- Logout -->
    <div class="px-4 pb-8 border-t border-slate-100 dark:border-slate-800 pt-4">
        <button (click)="logout()"
            class="flex items-center gap-4 w-full px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-xl transition-all">
            <span class="material-icons-outlined text-xl">logout</span>
            Sair
        </button>
    </div>
</div>

<div class="px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Formulário -->
    <app-device-form class="lg:col-span-2" [id]="id() ?? ''" [mqttId]="mqttId()" [name]="name()" [model]="model()"
        [partnerId]="partnerId()" [partners]="partners()" [mode]="mode()" [loading]="releasing()"
        [releaseError]="releaseError()" (save)="save.emit($event)" (releaseManual)="releaseManual.emit($event)"
        (cancel)="cancel.emit()">
    </app-device-form>

    <!-- Card do QR Code -->
    <div class="space-y-6">
        <app-device-qr-card *ngIf="id()" [qrUrl]="qrUrl()" [mqttId]="mqttId()" [name]="name()" [model]="model()"
            [id]="id()!">
        </app-device-qr-card>
    </div>
</div>

<div
    class="space-y-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-3xl shadow-sm">
    <form (ngSubmit)="onSave()" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <!-- Mqtt Id -->
            <div class="space-y-2">
                <label for="mqttId" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Mqtt Id
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">qr_code</span>
                    <input id="mqttId" name="mqttId" type="text" [(ngModel)]="mqttId" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: POS-001">
                </div>
            </div>

            <!-- Nome do Dispositivo -->
            <div class="space-y-2">
                <label for="name" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Nome do Dispositivo
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">label</span>
                    <input id="name" name="name" type="text" [(ngModel)]="name" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Chuveiro Masculino 01">
                </div>
            </div>

            <!-- Modelo -->
            <div class="space-y-2">
                <label for="model" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Modelo / Fabricante
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">settings_remote</span>
                    <input id="model" name="model" type="text" [(ngModel)]="model" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Gertec GP-100">
                </div>
            </div>

            <!-- Parceiro Vinculado -->
            <div class="space-y-2">
                <label for="partner"
                    class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Parceiro Vinculado
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">handshake</span>
                    <select id="partner" name="partner" [(ngModel)]="partnerId" [disabled]="mode === 'view'"
                        [class]="getFieldClasses(true)">
                        <option [value]="null">Nenhum parceiro vinculado</option>
                        <option *ngFor="let partner of partners" [value]="partner.id">
                            {{ partner.name }}
                        </option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                </div>
            </div>

        </div>

        <!-- Ações -->
        <div class="flex flex-wrap items-center gap-4 pt-1">
            <button *ngIf="mode === 'edit'" type="submit" [disabled]="loading"
                class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-8 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-sm">
                <span class="material-icons-outlined text-lg">save</span>
                Salvar Alterações
            </button>
            <button *ngIf="id" type="button" (click)="onOpenReleaseModal()" [disabled]="loading"
                class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-8 py-3 rounded-xl font-bold flex items-center gap-2 transition-all shadow-sm">
                <span class="material-icons-outlined text-lg">bolt</span>
                Liberação Manual
            </button>
            <button type="button" (click)="onCancel()"
                class="px-8 py-3 rounded-xl font-bold text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all">
                {{ mode === 'edit' ? 'Cancelar' : 'Voltar' }}
            </button>
        </div>
    </form>
</div>

<!-- Modal de Liberação Manual -->
<div *ngIf="showReleaseModal()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-300">
    <div
        class="bg-white dark:bg-slate-900 w-full max-w-md rounded-[32px] shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 animate-in zoom-in-95 duration-300">
        <div class="p-8">
            <div class="flex items-center gap-4 mb-6">
                <div
                    class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                    <span class="material-icons-outlined text-2xl">bolt</span>
                </div>
                <div>
                    <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">
                        Liberação Manual</h3>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">{{ name }}</p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <label
                        class="text-[10px] uppercase tracking-widest font-black text-slate-400 dark:text-slate-500 ml-1">Tempo
                        de Liberação</label>
                    <div class="relative">
                        <select #timeSelect (change)="selectedReleaseMinutes.set(+timeSelect.value)"
                            class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-5 py-4 text-sm font-bold text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                            <option [value]="1">1 MIN</option>
                            <option [value]="3">3 MIN</option>
                            <option [value]="5">5 MIN</option>
                            <option [value]="10">10 MIN</option>
                        </select>
                        <span
                            class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                    </div>
                </div>

                <!-- Alerta de Aviso (Default) -->
                <div *ngIf="!loading && !releaseError"
                    class="bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-900/30 p-4 rounded-2xl">
                    <div class="flex gap-3">
                        <span class="material-icons-outlined text-amber-600 dark:text-amber-400 text-lg">warning</span>
                        <p class="text-[11px] text-amber-800 dark:text-amber-300 leading-relaxed font-medium">
                            Esta ação enviará um comando imediato ao terminal. Certifique-se de que o equipamento
                            está pronto.
                        </p>
                    </div>
                </div>

                <!-- Alerta de Loading -->
                <div *ngIf="loading"
                    class="bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900/30 p-4 rounded-2xl animate-pulse">
                    <div class="flex items-center gap-3">
                        <span
                            class="material-icons-outlined text-blue-600 dark:text-blue-400 text-lg animate-spin">sync</span>
                        <p
                            class="text-[11px] text-blue-800 dark:text-blue-300 leading-relaxed font-bold uppercase tracking-tight">
                            Enviando mensagem ao dispositivo...
                        </p>
                    </div>
                </div>

                <!-- Alerta de Erro -->
                <div *ngIf="releaseError"
                    class="bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-900/30 p-4 rounded-2xl animate-in shake duration-500">
                    <div class="flex gap-3">
                        <span
                            class="material-icons-outlined text-rose-600 dark:text-rose-400 text-lg">error_outline</span>
                        <p class="text-[11px] text-rose-800 dark:text-rose-300 leading-relaxed font-bold">
                            {{ releaseError }}
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button (click)="cancelRelease()"
                    class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 py-4 rounded-2xl font-black text-sm transition-all">
                    CANCELAR
                </button>
                <button (click)="confirmRelease()" [disabled]="loading"
                    class="flex-1 bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 py-4 rounded-2xl font-black text-sm transition-all flex items-center justify-center gap-2">
                    <span *ngIf="loading" class="material-icons-outlined animate-spin text-sm">sync</span>
                    {{ releaseError ? 'TENTAR NOVAMENTE' : 'CONFIRMAR' }}
                </button>
            </div>
        </div>
    </div>
</div>

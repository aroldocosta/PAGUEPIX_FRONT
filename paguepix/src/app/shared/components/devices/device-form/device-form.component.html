<div
    class="space-y-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-3xl shadow-sm">
    <form (ngSubmit)="onSave()" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">

            <!-- Nome do Dispositivo -->
            <div class="space-y-2">
                <label for="name" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Nome do Dispositivo
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">label</span>
                    <input id="name" name="name" type="text" [(ngModel)]="name" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Chuveiro Masculino 01">
                </div>
            </div>

            <!-- Modelo -->
            <div class="space-y-2">
                <label for="model" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Modelo
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">settings_remote</span>
                    <input id="model" name="model" type="text" [(ngModel)]="model" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Gertec GP-100">
                </div>
            </div>

            <!-- Tipo de Produto -->
            <div class="space-y-2">
                <label for="type" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Tipo de Produto
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">category</span>
                    <select id="type" name="type" [(ngModel)]="type" [disabled]="mode === 'view'"
                        [class]="getFieldClasses(true)">
                        <option value="">Selecione o tipo</option>
                        <option *ngFor="let t of types" [value]="t">{{ t }}</option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                </div>
            </div>

            <!-- Parceiro Vinculado -->
            <div class="space-y-2">
                <label for="partner"
                    class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Parceiro Vinculado
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">handshake</span>
                    <select id="partner" name="partner" [(ngModel)]="partnerId" [disabled]="mode === 'view'"
                        [class]="getFieldClasses(true)">
                        <option [value]="null">Nenhum parceiro vinculado</option>
                        <option *ngFor="let partner of partners" [value]="partner.id">
                            {{ partner.name }}
                        </option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                </div>
            </div>

            <!-- Placa de Hardware (Board) -->
            <div class="space-y-2">
                <label for="board" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Hardware(Board)
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">memory</span>
                    <select id="board" name="board" [(ngModel)]="boardId" [disabled]="mode === 'view'"
                        [class]="getFieldClasses(true)">
                        <option [value]="null">Nenhuma placa selecionada</option>
                        <option *ngFor="let board of boards" [value]="board.id">
                            {{ board.mqttId || board.name }}
                        </option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                </div>
            </div>

            <!-- ID da Loja Física (externalStoreId) - ADMIN APENAS -->
            <div class="space-y-2" *ngIf="isAdmin()">
                <label for="externalStoreId" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Nome da Loja (Mercado Pago)
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">storefront</span>
                    <input id="externalStoreId" name="externalStoreId" type="text" [(ngModel)]="externalStoreId" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Loja Centro">
                </div>
                <p class="text-[11px] text-slate-400 font-medium px-1">
                    Nome amigável da loja. O identificador único técnico será gerado com o ID do parceiro.
                </p>
            </div>

            <!-- ID do POS/Caixa (externalPosId) - ADMIN APENAS -->
            <div class="space-y-2" *ngIf="isAdmin()">
                <label for="externalPosId" class="flex items-center gap-2 text-sm font-bold text-gray-700 dark:text-slate-300">
                    Nome do POS / Caixa (Mercado Pago)
                    <span *ngIf="mode === 'view'" class="material-icons-outlined text-xs text-slate-400">lock</span>
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors">point_of_sale</span>
                    <input id="externalPosId" name="externalPosId" type="text" [(ngModel)]="externalPosId" [readonly]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Caixa 01">
                </div>
                <p class="text-[11px] text-slate-400 font-medium px-1">
                    Nome amigável do caixa. O identificador único técnico será gerado com o ID do dispositivo.
                </p>
            </div>

        </div>

        <!-- Ações -->
        <div class="flex flex-wrap items-center justify-between gap-4 pt-1">
            <!-- Cancelar / Voltar no lado esquerdo -->
            <div>
                <!-- Cancelar (apenas modo edit) -->
                <button *ngIf="mode === 'edit'" type="button" (click)="onCancel()"
                    class="w-full sm:w-auto text-center px-8 py-3 rounded-xl font-bold text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all">
                    Cancelar
                </button>
                <!-- Voltar (apenas modo view) -->
                <button *ngIf="mode === 'view'" type="button" (click)="onCancel()"
                    class="w-full sm:w-auto text-center px-8 py-3 rounded-xl font-bold text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all">
                    Voltar
                </button>
            </div>

            <!-- Botões primários no lado direito -->
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-end">
                <!-- Salvar (apenas modo edit) -->
                <button *ngIf="mode === 'edit'" type="submit" [disabled]="loading"
                    class="flex-1 sm:flex-none bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-4 sm:px-8 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
                    <span class="material-icons-outlined text-lg">save</span>
                    <span class="sm:hidden">Salvar</span>
                    <span class="hidden sm:inline">Salvar</span>
                </button>
            </div>
        </div>
    </form>
</div>

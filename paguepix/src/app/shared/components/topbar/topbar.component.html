<!-- =================== TOPBAR =================== -->
<header
    class="h-20 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between px-6 md:px-10 flex-shrink-0 transition-colors duration-300 w-full">

    <div class="flex flex-1 items-center gap-6">
        <!-- Platform Logo Left Side -->
        <a [routerLink]="dashboardRoute()"
            class="flex flex-col items-center md:flex-row md:items-center gap-1 md:gap-3 pr-4 md:pr-8 border-r border-slate-100 dark:border-slate-800 cursor-pointer hover:opacity-80 transition-opacity">
            <img src="logo.png" alt="PaguePix Logo" class="w-8 h-8 object-contain">
            <div class="flex flex-col items-center md:items-start">
                <span
                    class="text-[0.469rem] md:text-lg font-bold tracking-tight text-slate-900 dark:text-slate-100 leading-none">PaguePix</span>
                <span
                    class="hidden md:block text-[9px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mt-0.5">Plataforma</span>
            </div>
        </a>
    </div>

    <div class="flex items-center gap-4 md:gap-8">
        <!-- Theme Toggle -->
        <div
            class="flex items-center bg-slate-50 dark:bg-slate-800 p-1 rounded-2xl border border-slate-100 dark:border-slate-700 transition-colors">
            <button (click)="themeService.setTheme('light')" [class.bg-white]="!themeService.isDarkMode()"
                [class.shadow-sm]="!themeService.isDarkMode()" class="p-2 rounded-xl transition-all">
                <span class="material-icons-outlined text-sm text-slate-400"
                    [class.text-amber-500]="!themeService.isDarkMode()">light_mode</span>
            </button>
            <button (click)="themeService.setTheme('dark')" [class.bg-slate-700]="themeService.isDarkMode()"
                [class.shadow-sm]="themeService.isDarkMode()" class="p-2 rounded-xl transition-all">
                <span class="material-icons-outlined text-sm text-slate-400"
                    [class.text-indigo-400]="themeService.isDarkMode()">dark_mode</span>
            </button>
        </div>

        <!-- User Info (desktop only) -->
        <div class="hidden md:flex items-center gap-4 pl-8 border-l border-slate-100 dark:border-slate-800">
            <div class="text-right">
                <p class="text-sm font-bold text-slate-900 dark:text-slate-100 leading-none">Olá, {{ userName() }}</p>
                <p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 mt-1 uppercase tracking-wider">
                    {{ partnerName() }}</p>
            </div>
            <div class="relative">
                <div
                    class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 flex items-center justify-center overflow-hidden">
                    <img [src]="'https://ui-avatars.com/api/?name=' + userName() + '&background=e0e7ff&color=6366f1'"
                        alt="Avatar" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Hamburger Button (mobile only) -->
        <button (click)="toggleDrawer()"
            class="md:hidden flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">
            <span class="material-icons-outlined text-xl">{{ drawerOpen() ? 'close' : 'menu' }}</span>
        </button>
    </div>
</header>

<!-- ============ MOBILE DRAWER OVERLAY ============ -->
<div *ngIf="drawerOpen()" class="fixed inset-0 z-40 md:hidden" (click)="closeDrawer()">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
</div>

<!-- Drawer Panel -->
<div [class.translate-x-0]="drawerOpen()" [class.translate-x-full]="!drawerOpen()"
    class="fixed top-0 right-0 h-full w-72 z-50 md:hidden bg-white dark:bg-slate-900 shadow-2xl flex flex-col transition-transform duration-300 ease-in-out">

    <!-- Drawer Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 dark:border-slate-800">
        <div>
            <p class="text-sm font-bold text-slate-900 dark:text-slate-100 leading-none">{{ userName() }}</p>
            <p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 mt-1 uppercase tracking-wider">
                {{ partnerName() }}</p>
        </div>
        <button (click)="closeDrawer()"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
            <span class="material-icons-outlined text-xl">close</span>
        </button>
    </div>

    <!-- Nav Items -->
    <nav class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
        <a *ngFor="let item of menuItems()" (click)="navigate(item.route)" [class.bg-indigo-50]="isActive(item.route)"
            [class.dark:bg-indigo-950]="isActive(item.route)" [class.text-indigo-600]="isActive(item.route)"
            [class.border-l-4]="isActive(item.route)" [class.border-indigo-500]="isActive(item.route)"
            class="flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all cursor-pointer">
            <span class="material-icons-outlined text-xl" [class.text-indigo-600]="isActive(item.route)">{{ item.icon
                }}</span>
            {{ item.label }}
        </a>
    </nav>

    <!-- Logout -->
    <div class="px-4 pb-8 border-t border-slate-100 dark:border-slate-800 pt-4">
        <button (click)="logout()"
            class="flex items-center gap-4 w-full px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-xl transition-all">
            <span class="material-icons-outlined text-xl">logout</span>
            Sair
        </button>
    </div>
</div>

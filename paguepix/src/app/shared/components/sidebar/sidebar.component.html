<aside
    class="w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 hidden lg:flex flex-col transition-colors duration-300">
    <div class="p-8 pb-10 flex items-center gap-3">
        <img src="logo.png" alt="PaguePix Logo" class="w-10 h-10 object-contain">
        <div class="flex flex-col">
            <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">PaguePix</span>
            <span class="text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 -mt-1">
                {{ userRole() === 'ADMIN' ? 'Admin Panel' : 'Partner Panel' }}
            </span>
        </div>
    </div>

    <nav class="flex-1 px-6 space-y-2">
        <a *ngFor="let item of menuItems()" [routerLink]="item.route" [class.bg-indigo-50]="isActive(item.route)"
            [class.dark:bg-indigo-950/40]="isActive(item.route)" [class.text-[#6366f1]]="isActive(item.route)"
            [class.dark:text-[#818cf8]]="isActive(item.route)" [class.border-l-4]="isActive(item.route)"
            [class.border-[#6366f1]]="isActive(item.route)" [class.dark:border-[#818cf8]]="isActive(item.route)"
            class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-[#6366f1] dark:hover:text-[#818cf8] transition-all group">
            <span class="material-icons-outlined text-xl" [class.text-[#6366f1]]="isActive(item.route)"
                [class.dark:text-[#818cf8]]="isActive(item.route)">
                {{ item.icon }}
            </span>
            {{ item.label }}
        </a>

        <div class="pt-8 pb-4">
            <span
                class="px-4 text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500">Configurações</span>
        </div>

        <a href="#"
            class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-[#6366f1] dark:hover:text-[#818cf8] transition-all group">
            <span
                class="material-icons-outlined text-xl text-slate-400 dark:text-slate-600 group-hover:text-[#6366f1] dark:group-hover:text-[#818cf8]">settings</span>
            Configurações
        </a>
    </nav>

    <div class="p-6 border-t border-slate-100 dark:border-slate-800">

        <button (click)="logout()"
            class="flex items-center gap-4 w-full px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-xl transition-all">
            <span class="material-icons-outlined text-xl">logout</span> Sair
        </button>
    </div>
</aside>

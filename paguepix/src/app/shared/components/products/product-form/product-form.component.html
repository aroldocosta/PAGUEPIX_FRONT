<form (ngSubmit)="onSave()" #productForm="ngForm" class="space-y-8">
    <div class="space-y-6">
        <!-- Nome do Produto e Status Ativo -->
        <div class="grid grid-cols-1 md:grid-cols-[1fr,200px] gap-6">
            <!-- Nome do Produto -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    Nome do Produto
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">local_offer</span>
                    <input type="text" [(ngModel)]="name" name="name" required [disabled]="mode === 'view'"
                        [class]="getFieldClasses()" placeholder="Ex: Banho 10 Minutos">
                </div>
            </div>

            <!-- Status do Produto (Toggle Switch) -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    Status do Produto
                </label>
                <div
                    class="p-4 bg-slate-50/50 dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-800 flex items-center justify-between h-[54px]">
                    <span class="text-sm font-bold text-slate-900 dark:text-white">{{ active ? 'Ativo' : 'Inativo'
                        }}</span>
                    <label class="relative inline-flex items-center cursor-pointer group">
                        <input type="checkbox" [(ngModel)]="active" name="active" [disabled]="mode === 'view'"
                            class="sr-only peer">
                        <div
                            class="w-11 h-6 bg-slate-200 dark:bg-slate-700 rounded-full transition-all duration-300 
                                    peer-checked:bg-emerald-500 dark:peer-checked:bg-emerald-600
                                    after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full">
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Subtítulo -->
        <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                Subtítulo
            </label>
            <div class="relative group">
                <span
                    class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">subtitles</span>
                <input type="text" [(ngModel)]="subtitle" name="subtitle" [disabled]="mode === 'view'"
                    [class]="getFieldClasses()" placeholder="Ex: Banho rápido">
            </div>
        </div>

        <!-- Descrição -->
        <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                Descrição
            </label>
            <div class="relative group">
                <span
                    class="material-icons-outlined absolute left-4 top-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors">description</span>
                <textarea rows="3" [(ngModel)]="description" name="description" [disabled]="mode === 'view'"
                    class="w-full pl-12 pr-4 py-4 bg-slate-50/50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl transition-all text-slate-900 dark:text-white outline-none font-medium text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 resize-none"
                    placeholder="Ex: Tempo de chuveiro"></textarea>
            </div>
        </div>

        <!-- Parceiro Responsável -->
        <div class="space-y-2" *ngIf="partners.length > 0">
            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                Parceiro Responsável
            </label>
            <div class="relative group">
                <span
                    class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">handshake</span>
                <select [(ngModel)]="partnerId" name="partnerId" required [disabled]="mode === 'view'"
                    [class]="getFieldClasses(true)">
                    <option value="" disabled selected>Selecione um parceiro...</option>
                    <option *ngFor="let p of partners" [value]="p.id">{{ p.name }}</option>
                </select>
                <span *ngIf="mode === 'edit'"
                    class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
            </div>
        </div>

        <!-- Preço e Método -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Preço -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    Preço (R$)
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">payments</span>
                    <input type="text" [(ngModel)]="priceDisplay" name="priceDisplay" required
                        [disabled]="mode === 'view'" [class]="getFieldClasses()" placeholder="R$ 0,00"
                        (input)="onPriceInput($event)">
                </div>
            </div>

            <!-- Método de Entrega -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    Método de Entrega
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">delivery_dining</span>
                    <select [(ngModel)]="deliveryMethod" name="deliveryMethod" required [disabled]="mode === 'view'"
                        [class]="getFieldClasses(true)">
                        <option *ngFor="let method of deliveryMethods" [value]="method">{{ method }}</option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                </div>
            </div>
        </div>

        <!-- Duração / Quantidade (Conditional Row) -->
        <div *ngIf="deliveryMethod === 'MQTT_TIMER' || deliveryMethod === 'MQTT_PULSE'"
            class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Duração ou Quantidade -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    {{ deliveryMethod === 'MQTT_PULSE' ? 'Quantidade (Pulsos)' : 'Duração' }}
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        {{ deliveryMethod === 'MQTT_PULSE' ? 'numbers' : 'timer' }}
                    </span>
                    <input type="number" [(ngModel)]="duration" name="duration" required [disabled]="mode === 'view'"
                        [class]="getFieldClasses()" [placeholder]="deliveryMethod === 'MQTT_PULSE' ? 'Ex: 10' : '0'">
                </div>
            </div>

            <!-- Unidade de Duração ou Frequência -->
            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1">
                    {{ deliveryMethod === 'MQTT_PULSE' ? 'Freq(Pulsos/s)' : 'Unidade' }}
                </label>
                <div class="relative group">
                    <span
                        class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        {{ deliveryMethod === 'MQTT_PULSE' ? 'tune' : 'schedule' }}
                    </span>
                    <select *ngIf="deliveryMethod !== 'MQTT_PULSE'" [(ngModel)]="durationUnit" name="durationUnit"
                        required [disabled]="mode === 'view'" [class]="getFieldClasses(true)">
                        <option value="SECONDS">Segundos</option>
                        <option value="MINUTES">Minutos</option>
                        <option value="HOURS">Horas</option>
                    </select>
                    <select *ngIf="deliveryMethod === 'MQTT_PULSE'" [(ngModel)]="freq" name="freq" required
                        [disabled]="mode === 'view'" [class]="getFieldClasses(true)">
                        <option *ngFor="let f of frequencyOptions" [ngValue]="f">{{ f }} pulsos/s</option>
                    </select>
                    <span *ngIf="mode === 'edit'"
                        class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-10 pt-4">
        <button type="button" (click)="onCancel()"
            class="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all">
            Cancelar
        </button>
        <button *ngIf="mode === 'edit'" type="submit" [disabled]="!productForm.form.valid || loading"
            class="px-10 py-3 bg-indigo-600/40 hover:bg-indigo-600/60 text-indigo-700 dark:text-indigo-200 border border-indigo-100 dark:border-indigo-900/30 rounded-2xl text-sm font-black transition-all flex items-center gap-2 group disabled:opacity-50">
            <span *ngIf="loading"
                class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span>
            {{ loading ? 'Salvando...' : 'Salvar' }}
            <span *ngIf="!loading"
                class="material-icons-outlined text-sm group-hover:translate-x-1 transition-transform rotate-[-30deg]">send</span>
        </button>
    </div>
</form>

<div
    class="lg:col-span-2 bg-white dark:bg-slate-900 pt-10 px-10 pb-0 rounded-[40px] border border-slate-100 dark:border-slate-800 shadow-sm relative overflow-hidden transition-colors flex flex-col w-full h-full">
    <div class="flex items-center justify-between mb-12 relative z-10">
        <div>
            <h3 class="text-xl font-black text-slate-900 dark:text-slate-100 tracking-tight">{{ title }}</h3>
            <p class="text-slate-400 dark:text-slate-500 text-sm font-bold mt-1">Volume de transações nos últimos {{
                selectedDays }} dias</p>
        </div>
        <div class="relative">
            <select
                class="appearance-none bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold rounded-2xl pl-4 pr-10 py-3 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all"
                (change)="onPeriodChange($event)">
                <option value="7" [selected]="selectedDays === 7">Últimos 7 Dias</option>
                <option value="30" [selected]="selectedDays === 30">Últimos 30 Dias</option>
            </select>
            <span
                class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-600 pointer-events-none">expand_more</span>
        </div>
    </div>

    <!-- Chart Area -->
    <div class="flex-1 flex items-stretch justify-between px-4 pt-7 gap-3 min-h-[300px] relative">
        <div *ngFor="let item of chartData()" class="flex-1 relative">
            <!-- Bar or Dash -->
            <div class="absolute inset-x-1 rounded-xl transition-all duration-500 hover:brightness-110 group"
                [style.bottom.px]="60" [style.height]="item.rawAmount === 0 ? '3px' : (item.value * 90 / 85) + '%'"
                [class.bg-slate-200]="item.rawAmount === 0" [class.dark:bg-slate-700]="item.rawAmount === 0"
                [class.bg-indigo-600]="item.rawAmount > 0 && item.value === maxChartValue()"
                [class.bg-indigo-400]="item.rawAmount > 0 && item.value < maxChartValue() && item.value >= maxChartValue() * 0.6"
                [class.bg-indigo-200]="item.rawAmount > 0 && item.value < maxChartValue() * 0.6">

                <!-- Value above bar -->
                <span
                    class="absolute inset-x-0 text-center text-[10px] font-black text-slate-400 dark:text-slate-600 tracking-widest whitespace-nowrap transition-all"
                    [style.top]="'-1.5em'" [style.transform]="selectedDays === 30 ? 'rotate(-90deg)' : 'none'"
                    [style.transform-origin]="'center'">
                    {{ item.rawAmount | currency:'BRL':'symbol':'1.0-0' }}
                </span>

                <!-- Tooltip -->
                <div
                    class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-700 text-white text-[10px] font-bold px-2 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-20">
                    {{ item.rawAmount | currency:'BRL':'symbol':'1.2-2' }}
                </div>
            </div>

            <!-- Day label: perfectly aligned with Status card base (32px) -->
            <span
                class="absolute bottom-8 inset-x-0 text-center text-[10px] font-black text-slate-400 dark:text-slate-600 tracking-widest leading-none">
                {{ item.day }}
            </span>
        </div>
    </div>
</div>

<div
    class="flex flex-col h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 overflow-hidden transition-colors duration-300">

    <!-- Top Bar Full Width -->
    <app-topbar [searchPlaceholder]="searchPlaceholder"></app-topbar>

    <!-- Boxed Content Area -->
    <div class="max-w-[1660px] mx-auto w-full px-4 flex flex-1 overflow-hidden mt-6 gap-6">

        <!-- Left Column: Partner Logo + Sidebar -->
        <aside class="w-72 flex-shrink-0 flex flex-col gap-6 hidden lg:flex h-full pb-6">

            <!-- Partner Logo Card -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] p-6 flex flex-col items-center justify-center shadow-sm">
                <h2 class="text-2xl font-black text-slate-900 dark:text-slate-100 tracking-tight">{{ partnerName() ||
                    'Parceiro' }}</h2>
                <span
                    class="text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500 mt-1">Logo
                    do Parceiro</span>
            </div>

            <!-- Sidebar Container -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[32px] overflow-hidden flex-1 shadow-sm flex flex-col">
                <app-sidebar class="flex-1 overflow-y-auto"></app-sidebar>
            </div>

        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto pb-10 pr-2">
            <div class="w-full">
                <header class="flex items-center justify-between mb-10">
                    <div>
                        <h1
                            class="text-[1.05rem] md:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                            {{ title }}</h1>
                        <p class="text-[0.7rem] md:text-base text-slate-500 dark:text-slate-400 mt-1 font-medium">{{
                            subtitle }}</p>
                    </div>
                    <!-- Desktop button (hidden on mobile) -->
                    <div class="hidden md:flex items-center gap-4">
                        <ng-content select="[headerActions]"></ng-content>
                        
                        <div class="flex items-center gap-4" *ngIf="addButtonLabel">
                            <ng-container *ngIf="addRoute; else noRouteBtnDesktop">
                                <a [routerLink]="addRoute"
                                    class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-6 py-3 rounded-2xl text-sm font-bold shadow-sm transition-all flex items-center gap-2 group cursor-pointer inline-flex">
                                    <span
                                        class="material-icons-outlined text-sm transition-transform group-hover:rotate-90">{{
                                        addButtonIcon }}</span> {{ addButtonLabel }}
                                </a>
                            </ng-container>
                            <ng-template #noRouteBtnDesktop>
                                <button
                                    class="bg-indigo-50/50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 px-6 py-3 rounded-2xl text-sm font-bold shadow-sm transition-all flex items-center gap-2 group">
                                    <span
                                        class="material-icons-outlined text-sm transition-transform group-hover:rotate-90">{{
                                        addButtonIcon }}</span> {{ addButtonLabel }}
                                </button>
                            </ng-template>
                        </div>
                    </div>
                </header>

                <!-- Table Container -->
                <div
                    class="bg-white dark:bg-slate-900 rounded-[32px] shadow-sm border border-slate-100 dark:border-slate-800 ring-1 ring-slate-900/5 dark:ring-white/10 overflow-hidden">
                    <div class="overflow-x-auto">
                        <!-- Loading State -->
                        <div *ngIf="loading()" class="p-16 flex flex-col items-center justify-center space-y-4">
                            <div
                                class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin">
                            </div>
                            <p class="text-slate-500 dark:text-slate-400 font-bold tracking-wide">Carregando...</p>
                        </div>

                        <!-- Empty State -->
                        <div *ngIf="!loading() && !hasData()" class="p-16 text-center">
                            <span class="material-icons-outlined text-5xl text-slate-200 dark:text-slate-800 mb-4">{{
                                emptyStateIcon }}</span>
                            <p class="text-slate-500 dark:text-slate-400 font-bold">{{ emptyStateMessage }}</p>
                        </div>

                        <!-- Custom Table Content -->
                        <div *ngIf="!loading() && hasData()">
                            <ng-container *ngTemplateOutlet="tableContent || defaultTable"></ng-container>
                        </div>
                    </div>
                </div>

                <div class="mt-12">
                    <app-footer></app-footer>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile FAB (hidden on desktop) -->
    <ng-container *ngIf="addButtonLabel">
        <ng-container *ngIf="addRoute; else noRouteFab">
            <a [routerLink]="addRoute"
                class="md:hidden fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-indigo-50/80 dark:bg-indigo-500/20 backdrop-blur-md text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 flex items-center justify-center shadow-lg active:scale-95 transition-all duration-150"
                aria-label="{{ addButtonLabel }}">
                <span class="material-icons-outlined text-2xl">add</span>
            </a>
        </ng-container>
        <ng-template #noRouteFab>
            <button
                class="md:hidden fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-indigo-50/80 dark:bg-indigo-500/20 backdrop-blur-md text-[#6366f1] dark:text-[#818cf8] border border-indigo-100 dark:border-indigo-500/20 flex items-center justify-center shadow-lg active:scale-95 transition-all duration-150"
                aria-label="{{ addButtonLabel }}">
                <span class="material-icons-outlined text-2xl">add</span>
            </button>
        </ng-template>
    </ng-container>

</div>

<ng-template #defaultTable>
    <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50/50 dark:bg-slate-800/50 border-b border-gray-100 dark:border-slate-800">
            <tr>
                <ng-container *ngTemplateOutlet="tableHeader"></ng-container>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-slate-800">
            <ng-container *ngTemplateOutlet="tableRow"></ng-container>
        </tbody>
    </table>
</ng-template>
